{% load static %}
<!doctype html>
<html lang="en">
    <header>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Home</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <link href="{% static 'styles.css'%}" rel="stylesheet">
      </header>
      <body>
        <div class="container text-center mb-3">
          <div class="row">
            <div class="col" id="username">
            </div>
            <div class="col">
              <a href="http://127.0.0.1:8000/settings/change-password/">
                <button class="btn btn-primary" id="change-pass-btn">Change password</button>
              </a>
            </div>
            <div class="col">
              <button type="button" class="btn btn-primary" id="logout-btn">Logout</button>
              </div>
            </div>
          </div>

          <div class="container text-left">
            <h1>Tasks list</h1>
            <form>
              {% csrf_token %}
              <div class="mb-3 col">
                <div class="col">
                  <label for="task-name" class="form-label">Add Task</label>
                  <input 
                    type="text"
                    class="form-control"
                    id="task-name"
                    aria-describedby="add-task"
                    name="task-name"
                    placeholder="Nombre">
                  <input 
                  type="text"
                  class="form-control"
                  id="task-desc"
                  aria-describedby="add-task"
                  name="task-description"
                  placeholder="Description">
                </div>
                <div class="col">
                  <button type="button" class="btn btn-primary " id="add-task-btn">Agregar</button>
                </div>
              </div>
            </form>
            <div class="container" id="task-list">
            </div>
          </div>
          
          <script type="module" src="{% static 'utils.js' %}"></script>
          <script type="module" src="{% static 'get_user_data.js' %}"></script>
          <script type="module" src="{% static 'get_tasks.js' %}"></script>
          <script type="module" src="{% static 'logout.js' %}"></script>
          <script type="module" src="{% static 'add_task.js' %}"></script>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    </body>
</html>
